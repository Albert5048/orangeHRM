name: Playwright Tests

on:
  push:
    branches: [main, master, E2E]
  pull_request:
    branches: [main, master, E2E]

permissions:
  contents: read

jobs:
  test:
    name: Test with Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Allure reporter and CLI
        run: npm install --no-save --package-lock=false allure-playwright allure-cli @playwright/test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: playwright
        run: npx playwright test --reporter=allure

      - name: Generate Allure HTML report
        if: always()
        run: |
          if [[ ! -d allure-results ]]; then
            echo "Allure results were not generated."
            exit 1
          fi
          npx allure generate allure-results -o allure-report --single-file

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-html
          path: allure-report/index.html
          if-no-files-found: error
          retention-days: 30